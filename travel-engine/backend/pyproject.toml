[project]
name = "travel-engine-backend"
version = "0.1.0"
description = "Travel Planning and Experience Engine API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.4",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-tasks>=2.16.2",
    "google-cloud-secret-manager>=2.19.0",
    "firebase-admin>=6.5.0",
    "vertexai>=1.47.0",
    "httpx>=0.27.0",
    "celery>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
