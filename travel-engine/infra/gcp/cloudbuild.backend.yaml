steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_APP_NAME-repo/backend:$COMMIT_SHA', './backend']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_APP_NAME-repo/backend:$COMMIT_SHA']
    
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_APP_NAME-backend'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_APP_NAME-repo/backend:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - '$_APP_NAME-sa@$PROJECT_ID.iam.gserviceaccount.com'

substitutions:
  _REGION: us-central1
  _APP_NAME: travel-engine

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_APP_NAME-repo/backend:$COMMIT_SHA'
