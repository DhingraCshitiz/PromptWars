steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    dir: 'frontend'
    args: ['install']

  # Build the Angular app
  - name: 'node:20'
    entrypoint: npm
    dir: 'frontend'
    args: ['run', 'build']

  # Deploy to Firebase Hosting
  - name: 'gcr.io/$_PROJECT_ID/firebase'
    dir: 'frontend'
    args: ['deploy', '--project', '$PROJECT_ID', '--only', 'hosting']
