services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: sqlite+aiosqlite:///./data/traveldb.sqlite
      # Optional: set GEMINI_API_KEY for real Gemini-generated itineraries via google-generativeai.
      USE_MOCK_GOOGLE: "true"
      SQLALCHEMY_ECHO: "false"
    volumes:
      - backend-data:/app/data

volumes:
  backend-data:
